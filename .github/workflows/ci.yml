name: CI
on:
  push: { branches: [main, "claude/**"] }
  pull_request:
permissions: { contents: read }

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: backend/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q -m "not live"   # includes real-SRTM tests (downloads one public tile); live Gemma tests are manual
      - run: cfn-lint ../infra/marga.cfn.yml
      - run: python scripts/benchmark.py 120

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint src/routes src/components/map src/components/plan src/components/AppShell.tsx src/lib/api.ts src/lib/format.ts src/lib/types.ts
      - run: NITRO_PRESET=node-server npm run build

  e2e:
    # Full-stack browser test with real sign-in against test doubles of the identity provider and of Gemma.
    # Uses the labelled development fixture network (real SRTM elevations, synthetic road layout) so it runs
    # without OpenStreetMap or Overture access.
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: pip install -r backend/requirements.txt
      - run: npm ci && npx playwright install --with-deps chromium && NITRO_PRESET=node-server npm run build
        working-directory: frontend
      - name: Start test doubles, API and web
        working-directory: backend
        run: |
          python scripts/make_dev_fixture.py data/dev/network.json.gz
          nohup python scripts/fake_gemma_server.py > /tmp/gemma.log 2>&1 &
          nohup python scripts/fake_oidc_server.py > /tmp/oidc.log 2>&1 &
          export MARGA_DATA_DIR=data/dev DATABASE_URL=sqlite:///data/dev/marga.db MARGA_WEATHER_ENABLED=false
          python scripts/dev_bootstrap.py
          export OIDC_ISSUER=http://localhost:9200 OIDC_CLIENT_ID=test-client OIDC_CLIENT_SECRET=test-secret
          export MARGA_PUBLIC_URL=http://localhost:3000 MARGA_COOKIE_SECURE=false CORS_ORIGINS=http://localhost:3000
          export GEMMA_API_KEY=fake GEMMA_ENDPOINT='http://127.0.0.1:9100/models/{model}:generateContent'
          nohup uvicorn gis_backend.api:app --port 8000 > /tmp/api.log 2>&1 &
          cd ../frontend && GIS_API_BASE=http://localhost:8000 PORT=3000 nohup node .output/server/index.mjs > /tmp/web.log 2>&1 &
          sleep 8
      - run: AI_E2E=1 node e2e/smoke.mjs
        working-directory: frontend

  docker:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t marga-backend backend && docker build -t marga-frontend frontend
